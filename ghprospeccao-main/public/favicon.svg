<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="50%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#FF3D00" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF6D00" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Modern dark rounded container so white GH and orange accents pop on ANY browser tab -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <g filter="url(#glow)">
    <!-- Magnifying Glass Handle (Orange Gradient) -->
    <rect x="74" y="342" width="46" height="114" rx="23" transform="rotate(-45 74 342)" fill="url(#orangeGrad)" />

    <!-- Magnifying Glass Ring / 'G' (White bold circular contour) -->
    <path d="M 236 140
             A 105 105 0 1 0 315 305
             L 282 272
             A 62 62 0 1 1 236 182
             A 62 62 0 0 1 292 238
             L 242 238
             L 242 278
             L 340 278
             L 340 240
             A 105 105 0 0 0 236 140 Z"
          fill="#FFFFFF" />

    <!-- Stylized 'H' intertwined to the right (White bold) -->
    <path d="M 338 185 L 378 185 L 378 248 L 416 248 L 416 185 L 456 185 L 456 360 L 416 360 L 416 288 L 378 288 L 378 360 L 338 360 Z"
          fill="#FFFFFF" />

    <!-- Person Icon inside the lens (Orange Gradient) -->
    <!-- Head -->
    <circle cx="218" cy="226" r="26" fill="url(#orangeGrad)" />
    <!-- Shoulders / Bust -->
    <path d="M 182 288 C 182 262 200 252 218 252 C 236 252 254 262 254 288 Z" fill="url(#orangeGrad)" />

    <!-- 3 Ascending Growth Chart Bars on top right (Orange Gradient) -->
    <rect x="352" y="160" width="22" height="42" rx="9" fill="url(#orangeGrad)" />
    <rect x="384" y="136" width="22" height="66" rx="9" fill="url(#orangeGrad)" />
    <rect x="416" y="110" width="22" height="92" rx="9" fill="url(#orangeGrad)" />
  </g>
</svg>
