name: Revisao segura
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/lead-integrity-and-auth-20261015
      - main
permissions:
  contents: read
  statuses: write
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Rating range regression tests
        run: npm run test:rating
      - name: Build
        run: npm run build

  integration-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Rating filter test
        run: npm run test:rating
      - name: Supabase and login regression tests
        run: npm test
      - name: Build
        run: npm run build

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Wait until production Supabase is connected
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 48); do
            if curl --fail --silent --show-error --max-time 10 'https://ghprospeccao.vercel.app/api/health' -o /tmp/gh-health.json && python3 -c "import json; d=json.load(open('/tmp/gh-health.json')); assert d.get('status')=='ok' and d.get('storage')=='connected' and d.get('googlePlacesConfigured') is True"; then
              echo 'Verified live Supabase connection and Google Places configuration.'
              ready=1
              break
            fi
            echo "Production backend not ready yet, attempt ${attempt}/48"
            sleep 10
          done
          if [ "$ready" != 1 ]; then
            echo 'Production backend did not confirm its Supabase connection.'
            exit 1
          fi
      - name: Verify live Google Places text search once
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 50 'https://ghprospeccao.vercel.app/api/health/google-once' -o /tmp/gh-google.json
          python3 -c "import json; d=json.load(open('/tmp/gh-google.json')); assert d.get('status')=='ok' and d.get('placesFound',0)>0"
          echo 'Google Places returned at least one real business.'
      - name: Reject unauthenticated access to commercial leads
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' 'https://ghprospeccao.vercel.app/api/leads')
          test "$status" = 401
          echo 'Unauthenticated lead access correctly denied.'

      - name: Publish externally visible production verification status
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RESULT" = "success" ]; then
            STATE=success
            MESSAGE="Supabase, Google Places and authentication passed on live production."
          else
            STATE=failure
            MESSAGE="Live production checks failed or were inconclusive."
          fi
          export STATE MESSAGE
          BODY=$(python3 -c 'import json,os; print(json.dumps({"state":os.environ["STATE"],"context":"production-live-validation","description":os.environ["MESSAGE"][:140]}))')
          curl --fail --silent --show-error --max-time 15 \
            -X POST -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT" >/dev/null

  production-api-diagnostic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Diagnose live API timings safely without exposing credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.error, urllib.request
          base="https://ghprospeccao.vercel.app"
          checks=[
            ("health","GET","/api/health",None),
            ("leads anonymous","GET","/api/leads",None),
            ("invalid freelancer","POST","/api/freelancer/auth/verify",{"accessCode":"__invalid_ci_read_probe__"}),
            ("danilo freelancer","POST","/api/freelancer/auth/verify",{"accessCode":"danilo"}),
          ]
          for name,method,path,payload in checks:
              body=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(base+path,data=body,method=method,headers={"Content-Type":"application/json","User-Agent":"GHProspecao-Diagnostic/1.0"})
              start=time.monotonic()
              try:
                  with urllib.request.urlopen(req,timeout=11) as resp:
                      status=resp.status
                      result=resp.read(16384).decode("utf-8","replace")
                      content_type=resp.headers.get("content-type","")
              except urllib.error.HTTPError as e:
                  status=e.code
                  content_type=e.headers.get("content-type","")
                  result=e.read(16384).decode("utf-8","replace")
              except Exception as e:
                  print(name,"network error",type(e).__name__,str(e)[:130],"seconds",round(time.monotonic()-start,2),flush=True)
                  continue
              keys={}
              if "json" in content_type:
                  try:
                      data=json.loads(result)
                      if isinstance(data,dict):
                          keys={k:data.get(k) for k in ("status","storage","code","success","error") if k in data}
                          keys["freelancer_present"]=isinstance(data.get("freelancer"),dict)
                          keys["token_present"]=isinstance(data.get("token"),str)
                  except Exception: pass
              print(name,"HTTP",status,"seconds",round(time.monotonic()-start,2),"type",content_type,"fields",keys,flush=True)
          PY
      - name: Diagnose static vs Supabase vs backend full timeout
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          checks=[
              ('site static','https://ghprospeccao.vercel.app/','GET',8),
              ('supabase public','https://omvcjpewxiuavjblrlnx.supabase.co/rest/v1/','GET',8),
              ('backend health full timeout','https://ghprospeccao.vercel.app/api/health','GET',65),
          ]
          for name,url,method,timeout in checks:
              started=time.monotonic()
              try:
                  req=urllib.request.Request(url,method=method,headers={'User-Agent':'GHProspecao-HealthProbe/1.0'})
                  try:
                      with urllib.request.urlopen(req,timeout=timeout) as response:
                          status=response.status; content_type=response.headers.get('content-type',''); content=response.read(2048).decode('utf-8','replace')
                  except urllib.error.HTTPError as e:
                      status=e.code; content_type=e.headers.get('content-type',''); content=e.read(2048).decode('utf-8','replace')
                  summary={}
                  if 'json' in content_type:
                      try:
                          data=json.loads(content)
                          summary={key:str(data.get(key))[:120] for key in ('status','storage','code','error') if key in data}
                      except Exception: pass
                  print(name,'status',status,'seconds',round(time.monotonic()-started,2),'summary',summary,flush=True)
              except Exception as e:
                  print(name,'EXCEPTION',type(e).__name__,'seconds',round(time.monotonic()-started,2),flush=True)
          PY
