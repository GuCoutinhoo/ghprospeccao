name: Revisao segura
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/lead-integrity-and-auth-20261015
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
