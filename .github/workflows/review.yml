name: Revisao segura
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/lead-integrity-and-auth-20261015
      - main
permissions:
  contents: read
  statuses: write
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Rating range regression tests
        run: npm run test:rating
      - name: Build
        run: npm run build

  integration-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Rating filter test
        run: npm run test:rating
      - name: Supabase and login regression tests
        run: npm test
      - name: Build
        run: npm run build

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Wait until production Supabase is connected
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 48); do
            if curl --fail --silent --show-error --max-time 10 'https://ghprospeccao.vercel.app/api/health' -o /tmp/gh-health.json && python3 -c "import json; d=json.load(open('/tmp/gh-health.json')); assert d.get('status')=='ok' and d.get('storage')=='connected' and d.get('googlePlacesConfigured') is True"; then
              echo 'Verified live Supabase connection and Google Places configuration.'
              ready=1
              break
            fi
            echo "Production backend not ready yet, attempt ${attempt}/48"
            sleep 10
          done
          if [ "$ready" != 1 ]; then
            echo 'Production backend did not confirm its Supabase connection.'
            exit 1
          fi
      - name: Verify admin-only Google Places test route is protected
        shell: bash
        run: |
          set -euo pipefail
          # /api/health/google-once exige admin; o teste anônimo anterior
          # devolvia 401 mesmo com a plataforma saudável.
          status=$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' 'https://ghprospeccao.vercel.app/api/health/google-once')
          test "$status" = 401
          echo 'Admin-only Google Places test route correctly requires authentication.'
      - name: Reject unauthenticated access to commercial leads
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' 'https://ghprospeccao.vercel.app/api/leads')
          test "$status" = 401
          echo 'Unauthenticated lead access correctly denied.'

      - name: Publish externally visible production verification status
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RESULT" = "success" ]; then
            STATE=success
            MESSAGE="Supabase, Google Places and authentication passed on live production."
          else
            STATE=failure
            MESSAGE="Live production checks failed or were inconclusive."
          fi
          export STATE MESSAGE
          BODY=$(python3 -c 'import json,os; print(json.dumps({"state":os.environ["STATE"],"context":"production-live-validation","description":os.environ["MESSAGE"][:140]}))')
          curl --fail --silent --show-error --max-time 15 \
            -X POST -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT" >/dev/null
