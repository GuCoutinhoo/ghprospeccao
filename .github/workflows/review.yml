name: Revisao segura
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/lead-integrity-and-auth-20261015
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build

  firebase-admin-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: ghprospeccao-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck latest implementation
        run: npm run typecheck
      - name: Build latest implementation
        run: npm run build
      - name: Run Firestore emulator integration suite
        run: npm run test:emulator
      - name: Run Supabase backend adapter integration suite
        run: npm run test:supabase
